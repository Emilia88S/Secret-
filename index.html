    #game {
        width: 100vw;
        height: 100vh;
        position: relative;

    /* TITLE SCREEN */
    #titleScreen {
        position: absolute;
        inset: 0;
        background: black;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 55px;
        font-weight: bold;
        z-index: 100;
        text-align: center;
    }

    /* CAVE */
    #cave {
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 50% 35%, #292040 0%, #11101d 35%, #05050b 80%);
    }

    #cave::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            linear-gradient(115deg, transparent 0 15%, #171326 16% 19%, transparent 20% 100%),
            linear-gradient(245deg, transparent 0 15%, #171326 16% 19%, transparent 20% 100%);
        opacity: 0.8;
    }

    /* GEMS */
    .gem {
        position: absolute;
        width: 30px;
        height: 45px;
        clip-path: polygon(50% 0%, 100% 30%, 75% 100%, 25% 100%, 0% 30%);
        animation: sparkle 2s infinite alternate;
        box-shadow: 0 0 20px currentColor;
    }

    .gem1 { left: 8%; top: 20%; background: #4fc3ff; color: #4fc3ff; }
    .gem2 { left: 18%; top: 65%; background: #b45cff; color: #b45cff; }
    .gem3 { left: 30%; top: 30%; background: #53ffae; color: #53ffae; }
    .gem4 { left: 42%; top: 72%; background: #ff5cd6; color: #ff5cd6; }
    .gem5 { left: 55%; top: 20%; background: #ffe95c; color: #ffe95c; }
    .gem6 { left: 68%; top: 63%; background: #5ce1ff; color: #5ce1ff; }
    .gem7 { left: 80%; top: 27%; background: #ff765c; color: #ff765c; }
    .gem8 { left: 90%; top: 72%; background: #b65cff; color: #b65cff; }
    .gem9 { left: 12%; top: 83%; background: #5cffd4; color: #5cffd4; }
    .gem10 { left: 75%; top: 85%; background: #ff5c9e; color: #ff5c9e; }

    @keyframes sparkle {
        from {
            transform: scale(0.9) rotate(-4deg);
            filter: brightness(0.8);

            transform: scale(1.15) rotate(4deg);

        background: linear-gradient(
            160deg,

            orange,

            lime,
            cyan,

            0 0 40px cyan,

    }

        position: absolute;

    /* EFFECT */
    #flash {
        position: absolute;
        inset: 0;

    #grape {

<body>

<div id="game">

    <!-- TITLE -->
    <div id="titleScreen">
        Secret???
    </div>

    <!-- CAVE -->
    <div id="cave">

        <!-- GEMS -->
        <div class="gem gem1"></div>
        <div class="gem gem2"></div>
        <div class="gem gem3"></div>
        <div class="gem gem4"></div>
        <div class="gem gem5"></div>
        <div class="gem gem6"></div>
        <div class="gem gem7"></div>
        <div class="gem gem8"></div>
        <div class="gem gem9"></div>
        <div class="gem gem10"></div>

        <!-- RAINBOW GEM -->
        <div id="rainbowGem"></div>

        <!-- GRAPE -->
        <div id="grape">🍇</div>

        <!-- CHARACTERS -->
        <div id="duck" class="character">🦆</div>
        <div id="wizard" class="character">🧙</div>

        <div id="instructions">
            Move with WASD or Arrow Keys
        </div>

    </div>

    <!-- FLASH -->
    <div id="flash"></div>

    <!-- DIALOGUE -->
    <div id="dialogueBox">
        <div id="speaker">Duck</div>
        <div id="dialogue"></div>
        <button id="continueButton">Continue ▶</button>
    </div>

    <!-- ENDING -->
    <div id="endingMessage">
        🍇 The magical grape was real...<br><br>
        But where did it come from?
    </div>

</div>

<script>

const titleScreen = document.getElementById("titleScreen");
const dialogueBox = document.getElementById("dialogueBox");
const speaker = document.getElementById("speaker");
const dialogue = document.getElementById("dialogue");
const continueButton = document.getElementById("continueButton");
const rainbowGem = document.getElementById("rainbowGem");
const grape = document.getElementById("grape");
const flash = document.getElementById("flash");
const endingMessage = document.getElementById("endingMessage");
const duck = document.getElementById("duck");
const wizard = document.getElementById("wizard");

let dialogueIndex = 0;
let gemTaken = false;
let gameStarted = false;

const conversations = [
    {
        speaker: "Duck",
        text: "Huh...? This cave wasn't here before..."
    },
    {
        speaker: "Wizard",
        text: "I don't sense any danger... but something is strange about this place."
    },
    {
        speaker: "Duck",
        text: "Whoa! Look at all those gems!"
    },
    {
        speaker: "Duck",
        text: "Wait..."
    },
    {
        speaker: "Duck",
        text: "These gems smell just like the magical grape..."
    },
    {
        speaker: "Wizard",
        text: "That shouldn't be possible..."
    },
    {
        speaker: "Duck",
        text: "There's one gem that's different from the others!"
    },
    {
        speaker: "Wizard",
        text: "It's glowing with every color..."
    },
    {
        speaker: "Duck",
        text: "I'm gonna take it!"
    }
];

function showDialogue() {

    if (dialogueIndex >= conversations.length) {
        dialogueBox.style.display = "none";
        startGemInteraction();
        return;
    }

    const line = conversations[dialogueIndex];

    speaker.textContent = line.speaker;
    dialogue.textContent = line.text;

    dialogueBox.style.display = "block";

    dialogueIndex++;
}

continueButton.addEventListener("click", showDialogue);

function startGemInteraction() {

    if (gemTaken) return;

    dialogueBox.style.display = "none";

    const message = document.createElement("div");

    message.style.position = "absolute";
    message.style.left = "50%";
    message.style.top = "62%";
    message.style.transform = "translateX(-50%)";
    message.style.color = "white";
    message.style.fontSize = "22px";
    message.style.zIndex = "60";
    message.style.textAlign = "center";
    message.textContent = "Walk into the rainbow gem!";

    document.getElementById("game").appendChild(message);

    function checkGem() {

        const duckRect = duck.getBoundingClientRect();
        const gemRect = rainbowGem.getBoundingClientRect();

        const distanceX =
            duckRect.left + duckRect.width / 2 -
            (gemRect.left + gemRect.width / 2);

        const distanceY =
            duckRect.top + duckRect.height / 2 -
            (gemRect.top + gemRect.height / 2);

        const distance = Math.sqrt(
            distanceX * distanceX +
            distanceY * distanceY
        );

        if (distance < 80) {

            gemTaken = true;

            message.remove();

            rainbowGem.style.display = "none";

            transformGem();

        } else {

            requestAnimationFrame(checkGem);

        }
    }

    checkGem();
}

function transformGem() {

    flash.style.opacity = "1";

    setTimeout(() => {
        flash.style.transition = "opacity 1s";
        flash.style.opacity = "0";
    }, 150);

    setTimeout(() => {

        grape.classList.add("grapeAppear");

        setTimeout(() => {

            dialogueIndex = 0;

            conversations.push(
                {
                    speaker: "Duck",
                    text: "IT TURNED INTO A GRAPE!!!"
                },
                {
                    speaker: "Wizard",
                    text: "So the magical grapes weren't just a myth..."
                },
                {
                    speaker: "Duck",
                    text: "Then there must be more of them!"
                },
                {
                    speaker: "Wizard",
                    text: "And this cave may be where they came from."
                },
                {
                    speaker: "Duck",
                    text: "We're definitely coming back here!"
                }
            );

            showDialogue();

        }, 1800);

    }, 500);
}

continueButton.addEventListener("click", () => {

    if (
        gemTaken &&
        dialogueIndex >= conversations.length
    ) {
        finishSecret();
    }

});

function finishSecret() {

    dialogueBox.style.display = "none";

    setTimeout(() => {

        endingMessage.style.display = "flex";

        setTimeout(() => {

            endingMessage.style.display = "none";

            // The secret part ends here.
            // You can connect this to another part later.

        }, 6000);

    }, 500);
}


/* MOVEMENT */

const keys = {};

document.addEventListener("keydown", (event) => {

    keys[event.key.toLowerCase()] = true;

});

document.addEventListener("keyup", (event) => {

    keys[event.key.toLowerCase()] = false;

});

let duckX = 40;
let duckY = 18;

function moveDuck() {

    if (!gameStarted || gemTaken) {
        requestAnimationFrame(moveDuck);
        return;
    }

    const speed = 0.45;

    if (keys["w"] || keys["arrowup"]) {
        duckY += speed;
    }

    if (keys["s"] || keys["arrowdown"]) {
        duckY -= speed;
    }

    if (keys["a"] || keys["arrowleft"]) {
        duckX -= speed;
    }

    if (keys["d"] || keys["arrowright"]) {
        duckX += speed;
    }

    duckX = Math.max(3, Math.min(92, duckX));
    duckY = Math.max(10, Math.min(80, duckY));

    duck.style.left = duckX + "%";
    duck.style.bottom = duckY + "%";

    requestAnimationFrame(moveDuck);
}


/* START */

setTimeout(() => {

    titleScreen.style.transition = "opacity 1s";
    titleScreen.style.opacity = "0";

    setTimeout(() => {

        titleScreen.style.display = "none";

        gameStarted = true;

        showDialogue();

        moveDuck();

    }, 1000);

}, 4000);

</script>

</body>
</html>
